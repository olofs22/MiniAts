name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: MiniAts.Api/web/package-lock.json
      - name: Install
        working-directory: MiniAts.Api/web
        run: npm ci
      # Tests use the development config, whose real env file is gitignored (local keys).
      - name: Test
        working-directory: MiniAts.Api/web
        run: |
          cp src/environments/environment.development.ts.example src/environments/environment.development.ts
          npx ng test --watch=false
      # Plain `ng build` would ship environment.ts's REPLACE-WITH-* placeholders (see DEPLOY.md).
      - name: Build
        working-directory: MiniAts.Api/web
        run: npm run build:prod
        env:
          API_URL: ${{ vars.API_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_PLANT_01F8F910F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "MiniAts.Api/web/dist/web/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_PLANT_01F8F910F }}
          action: "close"
