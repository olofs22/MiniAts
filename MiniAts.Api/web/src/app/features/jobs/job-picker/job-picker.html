<mat-form-field appearance="outline" class="w-full">
  <mat-label>Add to job</mat-label>
  <input
    matInput
    [ngModel]="searchTerm()"
    (ngModelChange)="searchTerm.set($event)"
    [matAutocomplete]="auto"
    [disabled]="loading()"
  />
  <mat-autocomplete #auto="matAutocomplete">
    @for (job of options(); track job.id) {
      <mat-option [value]="job.title" (onSelectionChange)="select(job)">
        {{ job.title }}
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>

@if (loading()) {
  <p class="text-sm text-slate-500">Loading jobs...</p>
} @else if (error()) {
  <p class="text-sm text-red-600">{{ error() }}</p>
}
