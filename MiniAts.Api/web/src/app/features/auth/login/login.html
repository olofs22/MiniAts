<div class="flex min-h-screen flex-col bg-linear-to-b from-indigo-50 via-slate-50 to-slate-50">
  <div class="flex flex-1 flex-col items-center justify-center px-4">
    <a routerLink="/welcome" class="mb-8" aria-label="Mini-ATS home"><app-logo size="lg" /></a>

    <mat-card class="w-full max-w-sm">
      <mat-card-header>
        <mat-card-title>Log in</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form class="flex flex-col gap-2" [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="email" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input
              matInput
              type="password"
              formControlName="password"
              autocomplete="current-password"
            />
          </mat-form-field>

          <a
            routerLink="/forgot-password"
            class="-mt-2 self-end text-sm text-slate-500 hover:text-slate-700"
          >
            Forgot password?
          </a>

          @if (error()) {
            <p class="text-sm text-red-600">{{ error() }}</p>
          }

          <button
            mat-stroked-button
            color="primary"
            type="submit"
            class="mt-2"
            [disabled]="form.invalid || loading()"
          >
            @if (loading()) {
              <mat-spinner diameter="20" />
            } @else {
              Log in
            }
          </button>
        </form>
      </mat-card-content>
    </mat-card>

    <a routerLink="/welcome" class="mt-4 text-sm text-slate-500 hover:text-slate-700">
      New to Mini-ATS? Request access
    </a>
  </div>

  <app-footer />
</div>
