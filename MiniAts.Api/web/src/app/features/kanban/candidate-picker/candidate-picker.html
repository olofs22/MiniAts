<mat-form-field appearance="outline" class="w-full">
  <mat-label>Add candidate</mat-label>
  <input
    matInput
    [ngModel]="searchTerm()"
    (ngModelChange)="searchTerm.set($event)"
    [matAutocomplete]="auto"
    [disabled]="loading()"
  />
  <mat-autocomplete #auto="matAutocomplete">
    @for (candidate of options(); track candidate.id) {
      <mat-option [value]="candidate.name" (onSelectionChange)="select(candidate)">
        {{ candidate.name }}
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>

@if (loading()) {
  <p class="text-sm text-slate-500">Loading candidates...</p>
} @else if (error()) {
  <p class="text-sm text-red-600">{{ error() }}</p>
}
