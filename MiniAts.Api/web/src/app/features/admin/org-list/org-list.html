<div class="mx-auto max-w-3xl p-6">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold text-slate-900">Organizations</h1>
    <a mat-stroked-button color="primary" routerLink="/admin/organizations/new">
      New organization
    </a>
  </div>

  @if (error()) {
    <p class="mt-4 text-sm text-red-600">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="mt-4 text-sm text-slate-500">Loading organizations...</p>
  } @else if (organizations().length === 0) {
    <p class="mt-4 text-sm text-slate-500">No organizations yet.</p>
  } @else {
    <ul class="mt-4 flex flex-col gap-3">
      @for (org of organizations(); track org.id) {
        <li
          class="flex items-center justify-between rounded-lg border border-slate-200 bg-white p-4"
        >
          <p class="font-medium text-slate-900">{{ org.name }}</p>
          <a mat-stroked-button [routerLink]="['/admin/users/new']" [queryParams]="{ orgId: org.id }">
            Invite user
          </a>
        </li>
      }
    </ul>
  }
</div>
