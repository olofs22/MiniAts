<div class="mx-auto max-w-lg p-6">
  <h1 class="text-xl font-semibold text-slate-900">New organization</h1>

  <form class="mt-4 flex flex-col gap-2" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    @if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
    }

    <div class="mt-2 flex items-center gap-2">
      <button mat-stroked-button color="primary" type="submit" [disabled]="form.invalid || saving()">
        @if (saving()) {
          <mat-spinner diameter="20" />
        } @else {
          Save
        }
      </button>
      <a mat-button routerLink="/admin">Cancel</a>
    </div>
  </form>
</div>
