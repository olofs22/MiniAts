<div class="mx-auto max-w-2xl p-6">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold">Mini-ATS</h1>
    <button mat-stroked-button (click)="signOut()">Logga ut</button>
  </div>

  @if (loadError()) {
    <p class="mt-4 text-sm text-red-600">{{ loadError() }}</p>
  } @else if (me(); as profile) {
    <p class="mt-4 text-sm text-gray-600">
      Inloggad som <strong>{{ profile.role }}</strong> (org {{ profile.orgId }})
    </p>
  } @else {
    <p class="mt-4 text-sm text-gray-600">Laddar profil...</p>
  }
</div>
