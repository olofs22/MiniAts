<div class="mx-auto max-w-2xl p-6">
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-semibold">Mini-ATS</h1>
    <div class="flex items-center gap-2">
      <a mat-stroked-button routerLink="/jobs">Jobs</a>
      <a mat-stroked-button routerLink="/candidates">Candidates</a>
      <button mat-stroked-button (click)="signOut()">Log out</button>
    </div>
  </div>

  @if (loadError()) {
    <p class="mt-4 text-sm text-red-600">{{ loadError() }}</p>
  } @else if (me(); as profile) {
    <p class="mt-4 text-sm text-gray-600">
      Signed in as <strong>{{ profile.role }}</strong> (org {{ profile.orgId }})
    </p>
  } @else {
    <p class="mt-4 text-sm text-gray-600">Loading profile...</p>
  }
</div>
