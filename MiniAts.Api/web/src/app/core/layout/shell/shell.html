<div class="flex min-h-screen flex-col bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-6">
      <div class="flex items-center gap-8">
        <a routerLink="/" class="text-lg font-semibold tracking-tight text-slate-900">
          Mini-ATS
        </a>
        <nav class="flex items-center gap-6">
          <a
            routerLink="/jobs"
            routerLinkActive="nav-link-active"
            class="nav-link text-sm font-medium text-slate-600"
          >
            Jobs
          </a>
          <a
            routerLink="/candidates"
            routerLinkActive="nav-link-active"
            class="nav-link text-sm font-medium text-slate-600"
          >
            Candidates
          </a>
          @if (me()?.role === 'Admin') {
            <a
              routerLink="/admin"
              routerLinkActive="nav-link-active"
              class="nav-link text-sm font-medium text-slate-600"
            >
              Admin
            </a>
          }
        </nav>
      </div>

      <div class="flex items-center gap-4">
        @if (me(); as profile) {
          <span class="text-sm text-slate-500">{{ profile.role }}</span>
        }
        <button mat-stroked-button (click)="signOut()">Log out</button>
      </div>
    </div>
  </header>

  <router-outlet />

  <div class="mt-auto">
    <app-footer />
  </div>
</div>
