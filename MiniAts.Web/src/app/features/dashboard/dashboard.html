<div class="mx-auto max-w-4xl p-6">
  <h1 class="text-2xl font-semibold text-slate-900">Welcome back</h1>
  @if (me(); as profile) {
    <p class="mt-1 text-sm text-slate-500">
      Signed in as <span class="font-medium text-slate-700">{{ profile.role }}</span>
    </p>
  }

  <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2">
    <a
      routerLink="/jobs"
      class="rounded-lg border border-slate-200 bg-white p-6 transition hover:border-slate-300 hover:shadow-sm"
    >
      <p class="text-base font-semibold text-slate-900">Jobs</p>
      <p class="mt-1 text-sm text-slate-500">Manage open roles and their Kanban boards.</p>
    </a>

    <a
      routerLink="/candidates"
      class="rounded-lg border border-slate-200 bg-white p-6 transition hover:border-slate-300 hover:shadow-sm"
    >
      <p class="text-base font-semibold text-slate-900">Candidates</p>
      <p class="mt-1 text-sm text-slate-500">Browse and manage your candidate pool.</p>
    </a>
  </div>
</div>
