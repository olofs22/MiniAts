<div class="flex min-h-screen flex-col bg-linear-to-b from-indigo-50 via-slate-50 to-slate-50">
  <div class="flex flex-1 flex-col items-center justify-center px-4">
    <a routerLink="/" class="mb-8" aria-label="Mini-ATS home"><app-logo size="lg" /></a>

    <mat-card class="w-full max-w-sm">
      <mat-card-header>
        <mat-card-title>Reset password</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        @if (sent()) {
          <p class="text-sm text-slate-700">
            If an account exists for {{ form.controls.email.value }}, we've sent a link to
            choose a new password. Check your inbox.
          </p>
        } @else {
          <p class="mb-4 text-sm text-slate-500">
            Enter your email and we'll send you a link to choose a new password.
          </p>
          <form class="flex flex-col gap-2" [formGroup]="form" (ngSubmit)="submit()">
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" autocomplete="email" />
            </mat-form-field>

            @if (error()) {
              <p class="text-sm text-red-600">{{ error() }}</p>
            }

            <button
              mat-stroked-button
              color="primary"
              type="submit"
              class="mt-2"
              [disabled]="form.invalid || sending()"
            >
              @if (sending()) {
                <mat-spinner diameter="20" />
              } @else {
                Send reset link
              }
            </button>
          </form>
        }
      </mat-card-content>
    </mat-card>

    <a routerLink="/login" class="mt-4 text-sm text-slate-500 hover:text-slate-700">
      Back to log in
    </a>
  </div>

  <app-footer />
</div>
